steps:
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - -t
      - us-east1-docker.pkg.dev/$PROJECT_ID/thecardlab/api:$COMMIT_SHA
      - -t
      - us-east1-docker.pkg.dev/$PROJECT_ID/thecardlab/api:latest
      - -f
      - artifacts/api-server/Dockerfile
      - .

  - name: gcr.io/cloud-builders/docker
    id: push
    waitFor: [build]
    args:
      - push
      - --all-tags
      - us-east1-docker.pkg.dev/$PROJECT_ID/thecardlab/api

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    waitFor: [push]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - thecardlab-api
      - --image=us-east1-docker.pkg.dev/$PROJECT_ID/thecardlab/api:$COMMIT_SHA
      - --region=us-east1
      - --platform=managed
      - --port=8080
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=100
      - --concurrency=80
      - --timeout=60s
      - --service-account=thecardlab-api@$PROJECT_ID.iam.gserviceaccount.com
      - --set-secrets=CLERK_SECRET_KEY=CLERK_SECRET_KEY:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,KV_REST_API_URL=KV_REST_API_URL:latest,KV_REST_API_TOKEN=KV_REST_API_TOKEN:latest,STRIPE_SECRET_KEY=STRIPE_SECRET_KEY:latest,STRIPE_WEBHOOK_SECRET=STRIPE_WEBHOOK_SECRET:latest,DATABASE_URL=DATABASE_URL:latest,FIRECRAWL_API_KEY=FIRECRAWL_API_KEY:latest
      - --set-env-vars=NODE_ENV=production,PORT=8080,GCS_BUCKET_NAME=thecardlab-card-images

images:
  - us-east1-docker.pkg.dev/$PROJECT_ID/thecardlab/api:$COMMIT_SHA
  - us-east1-docker.pkg.dev/$PROJECT_ID/thecardlab/api:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
