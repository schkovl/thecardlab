apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: thecardlab-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "100"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: thecardlab-api@PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: us-east1-docker.pkg.dev/PROJECT_ID/thecardlab/api:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: 1Gi
              cpu: "1"
          env:
            - name: PORT
              value: "8080"
            - name: NODE_ENV
              value: production
            - name: GCS_BUCKET_NAME
              value: thecardlab-card-images
